name: Database backup

# Every night: dump the zamzam schema, encrypt it, and keep it 7 days as a workflow artifact.
# The free Supabase plan has no point-in-time restore, so this is the only way back after a bad delete.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DEV_DB_PASSWORD  the database password (already used by the keep-alive)
#   BACKUP_PASSPHRASE         a long passphrase you keep in your password manager; without it a backup can't be opened
# At launch, point PGHOST/PGUSER and the password secret at the production database. Restore: docs/BACKUP.md.

on:
  schedule:
    - cron: '41 1 * * *'     # 01:41 UTC every night (03:41 in Cairo)
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGHOST: aws-1-eu-central-1.pooler.supabase.com
      PGPORT: '5432'          # session pooler: pg_dump can't run through the transaction pooler (6543)
      PGDATABASE: postgres
      PGUSER: postgres.cngczppokulovwegzhdq
      PGPASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: '20'
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets
        run: |
          [ -n "$PGPASSWORD" ] || { echo "::error::Add the repository secret SUPABASE_DEV_DB_PASSWORD."; exit 1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::Add the repository secret BACKUP_PASSPHRASE."; exit 1; }

      - name: Install pg_dump matching the server
        run: |
          # pg_dump must be at least the server's version, so ask the server first.
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          major=$(psql -v ON_ERROR_STOP=1 -tAc 'show server_version_num' | cut -c1-2)
          echo "Server is PostgreSQL $major"
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq "postgresql-client-$major" >/dev/null
          echo "PG_BIN=/usr/lib/postgresql/$major/bin" >> "$GITHUB_ENV"

      - name: Dump and encrypt
        run: |
          name="zamzam-$(date -u +%Y-%m-%d)"
          "$PG_BIN/pg_dump" --format=custom --schema=zamzam --no-owner --no-privileges --file "$name.dump"
          echo "Tables: $("$PG_BIN/pg_restore" --list "$name.dump" | grep -c ' TABLE DATA ')"
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" \
              --output "$name.dump.gpg" "$name.dump"
          rm "$name.dump"   # only the encrypted copy leaves this machine
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"
          ls -l "$name.dump.gpg"

      - name: Keep it 7 days
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.dump.gpg
          retention-days: 7
          if-no-files-found: error
