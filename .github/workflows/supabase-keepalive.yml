name: Supabase keep-alive

# The free Supabase plan pauses a project after 7 days without use.
# This sends one tiny query every 3 days so the dev database never pauses.
# Needs the repository secret SUPABASE_DEV_DB_PASSWORD (Settings → Secrets and variables → Actions).

on:
  schedule:
    - cron: '17 6 */3 * *'   # 06:17 UTC on every 3rd day of the month
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the zamzam-dev database
        env:
          PGHOST: aws-1-eu-central-1.pooler.supabase.com
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.cngczppokulovwegzhdq
          PGPASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '20'
        run: |
          if [ -z "$PGPASSWORD" ]; then
            echo "::error::Add the repository secret SUPABASE_DEV_DB_PASSWORD first."
            exit 1
          fi
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          products=$(psql -v ON_ERROR_STOP=1 -tAc 'select count(*) from zamzam."Products"')
          echo "Database is awake. Products: $products"
