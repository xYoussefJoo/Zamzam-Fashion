# GitHub checks our packages every week and opens a pull request when one has an update or a security fix.
# Small updates come grouped in one PR per area, so the list stays short; CI runs on each PR before you merge.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule: { interval: weekly, day: sunday }
    open-pull-requests-limit: 5
    groups:
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: sunday }
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
