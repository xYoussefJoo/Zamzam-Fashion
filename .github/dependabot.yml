# GitHub checks our packages and opens a pull request when one has an update or a security fix.
# Kept quiet on purpose: small updates come grouped in one PR per area, GitHub Actions in one PR a month,
# and big (major) jumps of build and test tools wait until after launch. CI runs on each PR before you merge.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule: { interval: weekly, day: sunday }
    open-pull-requests-limit: 3
    groups:
      backend-minor:
        update-types: [minor, patch]
    ignore:
      # Test tools: no benefit to the shop, major versions wait until after launch.
      - dependency-name: "xunit*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.NET.Test.Sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "coverlet*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: sunday }
    open-pull-requests-limit: 3
    groups:
      frontend-minor:
        update-types: [minor, patch]
    ignore:
      # @types/node stays on the major the frontend targets (20 today), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Big build/lint tool jumps need the teammate's decision, not a bot's.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
